<h2 class="task-heading"> 📋 Task List</h2>
<div class="task-card"> 
  <div class="task-left">      
<ul>

  <li *ngFor="let task of tasks()">

    <h3>{{ task.title }}</h3>

    <p>{{ task.description }}</p>

   <div class="task-buttons">

  <button
    class="edit-btn"
    (click)="editTask(task)"
  >
    Edit
  </button>

  <button
    class="delete-btn"
    (click)="removeTask(task.id)"
  >
    Delete
  </button>

</div>
  </li>

</ul>

<!-- EDIT FORM -->

<div class="edit-form" *ngIf="editingtask()">

  <input  class="edit-input"
    type="text"
    [(ngModel)]="editingtask().title"
  >

  <input  class="edit-input"
    type="text"
    [(ngModel)]="editingtask().description"
  >

  <button  class="save-btn" (click)="saveTask()">
    Save
  </button>

</div>
</div>
</div>
